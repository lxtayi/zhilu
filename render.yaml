services:
  - type: web
    name: zhilu-mvp
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ZHIHU_DATA_MODE
        value: auto
      - key: ZHIHU_ACCESS_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_REASONING_EFFORT
        value: low
